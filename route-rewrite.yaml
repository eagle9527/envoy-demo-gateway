# 场景 1: 路径重写 (Path Rewrite)
# 客户端请求: http://demo.example.com/gateway/prefix/api/rewrite-test
# 网关重写为: /api/rewrite-test
# 后端收到: /api/rewrite-test
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-route-rewrite
  namespace: default
spec:
  parentRefs:
  - name: eg
  hostnames:
  - "demo.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /gateway/prefix/api
    filters:
    - type: CORS
      cors:
        allowOrigins:
        - "*"
        allowMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        allowHeaders:
        - "authorization"
        - "content-type"
        - "x-debug"
        - "x-custom-client"
        - "x-custom-header"
        - "x-requested-with"
        exposeHeaders:
        - "content-length"
        - "x-request-id"
        maxAge: 86400s
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /api
    backendRefs:
    - name: demo-app
      port: 80
