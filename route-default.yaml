# 场景 3: 默认路由（禁止所有跨域）
# 转发所有其他请求到后端，但拒绝任何跨域请求
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-route-default
  namespace: default
spec:
  parentRefs:
  - name: eg
  hostnames:
  - "demo.example.com"
  rules:
  - matches:
      - path:
          type: PathPrefix
          value: /
    backendRefs:
      - name: demo-app  # 你的 Gin 应用 Service
        port: 80