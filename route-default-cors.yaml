# 场景 4: 默认路由（加 CORS）
# 用于模拟“入口层允许跨域”，并通过单独的 Host 区分是否开启 CORS。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-route-default-cors
  namespace: default
spec:
  parentRefs:
  - name: eg
  hostnames:
  - "cors.demo.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: CORS
      cors:
        allowOrigins:
        - "*"
        allowMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        allowHeaders:
        - "authorization"
        - "content-type"
        - "x-debug"
        - "x-custom-client"
        - "x-custom-header"
        - "x-requested-with"
        exposeHeaders:
        - "content-length"
        - "x-request-id"
        maxAge: 86400s
    backendRefs:
    - name: demo-app
      port: 80
