# 场景 2: 自定义 Header 路由
# 只有包含 Header "X-Debug: true" 的请求才会进入这个规则
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-route-header
  namespace: default
spec:
  parentRefs:
  - name: eg
  hostnames:
  - "demo.example.com"
  rules:
  - matches:
    - headers:
      - name: X-Debug
        value: "true"
      path:
        type: PathPrefix
        value: /debug
    backendRefs:
    - name: demo-app
      port: 80
